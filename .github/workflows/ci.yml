name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHPCS and PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpcs
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1", "8.3", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Build the release folder
        run: bin/build-zip.sh
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/dalli-delivery-for-woocommerce
          exclude-directories: ""
          ignore-warnings: true

  smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision WordPress + WooCommerce with a mock Dalli API
        run: bash docker/setup.sh
      - name: Back-end smoke test
        run: docker compose -f docker/docker-compose.yml --profile tools run --rm -T wpcli wp eval-file /smoke/orders.php
